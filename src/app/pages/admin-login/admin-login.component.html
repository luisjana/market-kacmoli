<div class="admin-login-page">

  <div class="login-card">

    <div class="login-brand">
      <h1>Market Kacmoli</h1>
      <p>Admin Panel</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Shkruani email-in"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Shkruani password-in"
          required>
      </div>

      <button type="submit">
        Hyr ne panel
      </button>

    </form>

    <div
      class="error-message"
      *ngIf="errorMessage">

      {{ errorMessage }}

    </div>

    <div class="back-home">
      <a routerLink="/">← Kthehu ne faqe</a>
    </div>

  </div>

</div>
